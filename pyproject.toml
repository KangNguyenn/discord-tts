[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-tts-gtk"
version = "0.1.0"
description = "A local-first GTK4 Discord TTS bot for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Discord TTS contributors" }]
dependencies = [
  "discord.py[voice]>=2.7.1,<3",
  "piper-tts>=1.3,<2",
  "keyring>=25,<27",
  "secretstorage>=3.2",
  "numpy>=1.26",
]

[project.scripts]
discord-tts = "discord_tts.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
discord_tts = ["ui/*.css"]
