name: One-time branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches except main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const targets = branches.filter(({ name }) => name !== "main");
            core.info(`Deleting ${targets.length} branches.`);
            for (const { name } of targets) {
              core.info(`Deleting branch: ${name}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${name}`,
              });
            }

      - name: Remove this temporary workflow
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = ".github/workflows/prune-branches.yml";
            const { data } = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: "main",
            });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              message: "Remove temporary branch cleanup workflow",
              sha: data.sha,
              branch: "main",
            });
