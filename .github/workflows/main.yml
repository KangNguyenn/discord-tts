name: Build Flatpak

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-flatpak:
    name: Build Discord TTS Flatpak (x86_64)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # flatpak-builder needs all Python wheels/sdists declared as sources.
      # Generate that source manifest on the CI machine, not on the user's PC.
      - name: Generate pinned Python dependency sources
        working-directory: packaging/flatpak
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pip-generator-venv
          /tmp/pip-generator-venv/bin/pip install --disable-pip-version-check \
            'requirements-parser>=0.11,<1' 'packaging>=23'
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/pip/flatpak-pip-generator.py \
            --output /tmp/flatpak-pip-generator.py
          /tmp/pip-generator-venv/bin/python /tmp/flatpak-pip-generator.py \
            --runtime=org.gnome.Sdk//50 \
            --requirements-file=requirements.txt \
            --output=python3-dependencies \
            --prefer-wheels=numpy,onnxruntime,piper-phonemize,PyNaCl,cffi,cryptography

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.kang.discordtts.yml
          bundle: Discord-TTS.flatpak
          artifact-name: Discord-TTS-x86_64
          branch: stable
          upload-artifact: true
          verbose: true
