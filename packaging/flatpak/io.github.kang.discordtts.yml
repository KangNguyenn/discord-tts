app-id: io.github.kang.discordtts
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: discord-tts
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  # Generate this file with flatpak-pip-generator; see README.
  - python3-dependencies.json
  - name: discord-tts
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 packaging/flatpak/io.github.kang.discordtts.desktop /app/share/applications/io.github.kang.discordtts.desktop
      - install -Dm644 packaging/flatpak/io.github.kang.discordtts.svg /app/share/icons/hicolor/scalable/apps/io.github.kang.discordtts.svg
    sources:
      - type: dir
        path: ../..
